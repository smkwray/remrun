[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remrun"
version = "0.0.1"
description = "Transparent remote execution for synced project trees"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "smkwray"}]
license = "MIT"
dependencies = []

[project.optional-dependencies]
metrics = ["psutil>=5.9"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
remrun = "remrun.cli:main"

[project.urls]
Repository = "https://github.com/smkwray/remrun"
Issues = "https://github.com/smkwray/remrun/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remrun = ["schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff 0.16 broadened its implicit defaults. Pin the intended correctness gate so
# `ruff check src tests` remains stable across supported Ruff versions.
select = ["E4", "E7", "E9", "F"]
